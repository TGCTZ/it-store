[project]
name = "tgc-itstore-backend"
version = "0.1.0"
description = "TGC IT office asset lending API"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<6",
  "djangorestframework>=3.18,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "django-cors-headers>=4.9,<5",
  "django-environ>=0.14,<1",
  "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = ["ruff>=0.16,<1"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
